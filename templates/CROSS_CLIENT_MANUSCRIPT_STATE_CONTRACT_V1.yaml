schema: CROSS_CLIENT_MANUSCRIPT_STATE_CONTRACT_V1
storage_policy: AUTHORITATIVE_PRIVATE_STATE_STORE_ONLY
namespace: one_MANUSCRIPT_ID_per_record
required_fields:
  MANUSCRIPT_ID: STABLE_PRIVATE_ID
  EXEMPLAR_STATE: S0_UNINITIALIZED | S1_MANUSCRIPT_PROFILED | S2_CANDIDATE_POOL_READY | S3_MASTER_20_SELECTED | S4_CORE_3_PENDING_AUTHOR_APPROVAL | S5_CORE_3_APPROVED | S6_CORPUS_DEEP_ANALYSIS_COMPLETE | S7_PROJECT_EXEMPLAR_SKILL_BUILT | S8_ACTIVE_FOR_WRITING | S9_REFRESH_REQUIRED
  MASTER20_VERSION: NOT_INITIALIZED | VERSION_STRING
  CORE3_VERSION: NOT_INITIALIZED | VERSION_STRING
  PROJECT_SKILL_VERSION: NOT_INITIALIZED | VERSION_STRING
  PAPER_ARTIFACT_RECORDS: []
cross_client_invariants:
  - CODEX_AND_CHATGPT_READ_THE_SAME_CONFIGURED_AUTHORITATIVE_RECORD
  - CHAT_HISTORY_IS_NOT_AUTHORITATIVE_STATE
  - NEVER_INHERIT_EXEMPLARS_OR_ARTIFACT_STATUS_ACROSS_MANUSCRIPT_IDS
  - EVERY_MASTER20_PAPER_HAS_A_PAPER_ARTIFACT_RECORD_V1
  - CORE3_AVAILABILITY_IS_SECONDARY_TO_SCIENTIFIC_AND_WRITING_FIT
  - PRIVATE_MANUSCRIPT_CONTENT_AND_RECORDS_MUST_NOT_ENTER_THIS_PUBLIC_TEMPLATE
missing_or_unavailable_state: REPORT_LIMITATION_AND_DO_NOT_ASSUME_ACTIVE_SKILL
