name: Validate Skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Basic structure check
        run: |
          test -f README.md
          test -d skills
          find skills -maxdepth 2 -name SKILL.md -print
      - name: Validate agentic research workflow
        run: python scripts/validation/validate_research_workflow.py
